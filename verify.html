<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>متابعة الطلب — Invest Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060e1c;
  --card:#0a1628;
  --panel:#0f1f35;
  --panel2:#132540;
  --line:rgba(255,255,255,0.06);
  --line2:rgba(255,255,255,0.11);
  --gold:#c9a24a;
  --blue:#2563a8;
  --blue-l:#5b9fd6;
  --orange:#f07030;
  --orange-dim:rgba(240,112,48,0.12);
  --green:#28c47a;
  --green-dim:rgba(40,196,122,0.12);
  --red:#e04040;
  --purple:#8b6af0;
  --muted:#6a7a90;
  --muted2:#3a4a5c;
  --text:#edf2f8;
  --text2:#a8bcd0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:'Tajawal','Inter',sans-serif;
  color:var(--text);
  background:var(--bg);
  display:flex;align-items:flex-start;justify-content:center;
  padding:24px 12px 80px;
  -webkit-font-smoothing:antialiased;
}
html[dir=ltr] body{font-family:'Inter','Tajawal',sans-serif}

/* ── CARD ── */
.card{
  width:100%;max-width:560px;
  background:var(--card);
  border:1px solid var(--line2);
  border-radius:20px;
  overflow:hidden;
  position:relative;
}
.card-bar{
  height:3px;
  background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--orange) 50%,var(--blue-l) 80%,transparent);
}

/* ── HEADER ── */
header{
  padding:28px 28px 20px;
  text-align:center;
  border-bottom:1px solid var(--line);
  position:relative;
  background:radial-gradient(ellipse 300px 80px at 50% 0%,rgba(37,99,168,0.12),transparent);
}
.lang-toggle{
  position:absolute;top:14px;inset-inline-end:14px;
  display:flex;gap:2px;background:var(--panel);
  border:1px solid var(--line2);border-radius:20px;padding:2px;
}
.lang-toggle button{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.06em;padding:4px 10px;border-radius:16px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;transition:all .18s;
}
.lang-toggle button.on{
  background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff;
}
.emblem{
  width:76px;height:76px;margin:0 auto 12px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.emblem::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(201,162,74,0.35);
}
.emblem img{
  width:68px;height:68px;border-radius:50%;position:relative;z-index:1;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;
}
header h1{
  font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;
}
header .sub{font-size:12.5px;color:var(--muted)}

/* ── PANEL ── */
.panel{padding:24px 24px 28px}
.field-label{
  font-size:10px;font-weight:700;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px;display:block;
}
.input-wrap{position:relative;margin-bottom:13px}
.input-wrap input{
  width:100%;padding:12px 42px 12px 14px;
  border:1px solid var(--line2);border-radius:10px;
  font-family:'IBM Plex Mono',monospace;font-size:14px;
  background:var(--panel2);color:var(--text);
  direction:ltr;text-align:left;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
html[dir=rtl] .input-wrap input{padding:12px 14px 12px 42px}
.input-wrap input:focus{
  border-color:var(--blue-l);
  box-shadow:0 0 0 3px rgba(91,159,214,0.12);
}
.input-wrap input::placeholder{color:var(--muted2)}
.btn-clear{
  position:absolute;top:50%;right:12px;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:15px;padding:4px;display:none;transition:color .15s;
}
html[dir=rtl] .btn-clear{right:auto;left:12px}
.btn-clear:hover{color:var(--text)}
.btn-clear.show{display:block}
.btn-main{
  width:100%;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),var(--blue-l));
  color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;
  font-family:inherit;letter-spacing:.03em;
  transition:transform .1s,box-shadow .2s;
  box-shadow:0 4px 18px rgba(37,99,168,0.3);
}
.btn-main:hover{box-shadow:0 6px 24px rgba(37,99,168,0.45)}
.btn-main:active{transform:scale(.99)}
.btn-main:disabled{opacity:.5;cursor:progress}

/* ── LOADING ── */
.loading{text-align:center;padding:36px 0}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:12px}
.dots span{
  width:8px;height:8px;border-radius:50%;background:var(--blue-l);
  animation:dpulse 1.3s ease-in-out infinite;
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dpulse{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── RESULT ── */
.result{margin-top:20px}

/* ── WELCOME ── */
.welcome{
  background:linear-gradient(135deg,rgba(37,99,168,0.15),rgba(201,162,74,0.08));
  border:1px solid rgba(201,162,74,0.2);border-radius:14px;
  padding:18px 20px;margin-bottom:18px;text-align:center;
  animation:fadeUp .4s ease-out;position:relative;overflow:hidden;
}
.welcome::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 180px 60px at 50% -10%,rgba(201,162,74,0.1),transparent);
  pointer-events:none;
}
.w-stars{font-size:16px;margin-bottom:7px;letter-spacing:5px}
.w-id{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.12em;color:var(--gold);margin-bottom:5px;text-transform:uppercase;
}
.w-name{font-size:17px;font-weight:800;margin-bottom:4px}
.w-msg{font-size:12px;color:var(--text2)}

/* ── SEAL ── */
.seal-wrap{text-align:center;margin-bottom:18px}
.seal{
  display:inline-flex;align-items:center;justify-content:center;
  width:84px;height:84px;border-radius:50%;position:relative;
  animation:stampIn .5s cubic-bezier(.18,1.4,.4,1) forwards;
  opacity:0;transform:scale(.2) rotate(-25deg);
}
@keyframes stampIn{
  0%{opacity:0;transform:scale(.2) rotate(-25deg)}
  65%{opacity:1;transform:scale(1.06) rotate(-4deg)}
  100%{opacity:1;transform:scale(1) rotate(-4deg)}
}
.seal::before{content:'';position:absolute;inset:0;border-radius:50%;border:2.5px solid currentColor}
.seal::after{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid currentColor;opacity:.35}
.seal-txt{position:relative;z-index:1;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:1.3}
.seal.ok{color:var(--green);filter:drop-shadow(0 0 14px rgba(40,196,122,.3))}
.seal.bad{color:var(--red);filter:drop-shadow(0 0 12px rgba(224,64,64,.25))}
.seal.warn{color:var(--gold);filter:drop-shadow(0 0 12px rgba(201,162,74,.2))}

/* ── PROGRESS ── */
.prog-section{margin-bottom:22px}
.prog-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}
.prog-label{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.prog-right{text-align:end}
.prog-pct{
  font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;
  line-height:1;transition:color .4s;
}
.prog-pct.hi{color:var(--green)}
.prog-pct.mid{color:var(--orange)}
.prog-pct.lo{color:var(--blue-l)}
.prog-step-name{font-size:10.5px;color:var(--muted);margin-top:2px}
.prog-bar-bg{
  height:6px;background:var(--panel2);border-radius:8px;
  overflow:hidden;position:relative;
}
.prog-bar-fill{
  height:100%;border-radius:8px;position:relative;
  background:linear-gradient(90deg,var(--blue),var(--blue-l) 45%,var(--green));
  width:0%;transition:width 1.1s cubic-bezier(.4,0,.2,1);
}
.prog-bar-fill::after{
  content:'';position:absolute;right:0;top:0;bottom:0;width:20px;
  background:rgba(255,255,255,0.22);border-radius:8px;
  animation:shimmer 1.6s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{opacity:0}50%{opacity:1}}

/* ── TIMELINE ── */
.timeline{margin:0 0 4px;padding:0 2px;user-select:none}
.tl-track-wrap{
  position:relative;
  height:3px;
  background:var(--line2);
  border-radius:3px;
  margin:26px 0 44px;
}
.tl-fill{
  position:absolute;left:0;top:0;height:100%;
  background:linear-gradient(90deg,var(--blue),var(--green));
  border-radius:3px;width:0%;
  transition:width .7s cubic-bezier(.4,0,.2,1);
}
.tl-nodes{
  position:absolute;top:50%;left:0;right:0;
  transform:translateY(-50%);
  display:flex;justify-content:space-between;
}
.tl-node{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .22s;position:relative;
  border:2px solid var(--muted2);
  background:var(--panel2);color:var(--muted);
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;
}
.tl-node:hover:not(.tl-active){
  border-color:var(--blue-l);color:var(--text);transform:scale(1.1);
}
.tl-node.tl-done{
  background:var(--blue);border-color:var(--blue-l);color:#fff;
}
.tl-node.tl-active{
  background:var(--orange);border-color:transparent;color:#fff;
  transform:scale(1.18);
  box-shadow:0 0 0 5px var(--orange-dim),0 0 18px rgba(240,112,48,.4);
  animation:pulse-node 2.2s ease-in-out infinite;
}
@keyframes pulse-node{
  0%,100%{box-shadow:0 0 0 4px var(--orange-dim),0 0 14px rgba(240,112,48,.3)}
  50%{box-shadow:0 0 0 8px rgba(240,112,48,.06),0 0 24px rgba(240,112,48,.15)}
}
.tl-node-label{
  position:absolute;top:calc(100% + 9px);
  left:50%;transform:translateX(-50%);
  font-size:10px;color:var(--muted);white-space:nowrap;
  transition:color .2s;max-width:68px;
  text-align:center;line-height:1.3;
}
.tl-node.tl-active .tl-node-label{color:var(--orange);font-weight:700}
.tl-node.tl-done .tl-node-label{color:var(--blue-l)}
/* Pin */
.tl-pin{
  position:absolute;top:50%;
  transition:left .55s cubic-bezier(.34,1.4,.64,1);
  transform:translateY(-100%) translateX(-50%);
  pointer-events:none;z-index:10;
}
.tl-pin svg{display:block;filter:drop-shadow(0 3px 8px rgba(240,112,48,.55))}

/* ── PAGE CONTENT ── */
.page-block{animation:fadeUp .28s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.phase-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 12px;border-radius:20px;margin-bottom:14px;
}

/* ── STEP ITEMS ── */
.steps-list{margin-bottom:14px}
.step-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:10px;margin-bottom:7px;
  border:1px solid var(--line);background:var(--panel);
  transition:border-color .2s,background .2s;
  position:relative;overflow:hidden;
}
.step-item::before{
  content:'';position:absolute;inset:0;opacity:0;
  transition:opacity .3s;
}
.step-item.s-done{border-color:rgba(40,196,122,0.2);background:rgba(40,196,122,0.04)}
.step-item.s-done::before{background:linear-gradient(90deg,rgba(40,196,122,0.05),transparent);opacity:1}
.step-item.s-current{border-color:rgba(240,112,48,0.35);background:rgba(240,112,48,0.06)}
.step-item.s-current::before{background:linear-gradient(90deg,rgba(240,112,48,0.08),transparent);opacity:1}
.step-item.s-upcoming{opacity:.5}
.step-dot{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
}
.step-dot.dot-done{background:var(--green-dim);border:1.5px solid var(--green);color:var(--green)}
.step-dot.dot-current{
  background:var(--orange-dim);border:1.5px solid var(--orange);color:var(--orange);
  animation:dotglow 2s ease-in-out infinite;
}
@keyframes dotglow{0%,100%{box-shadow:0 0 0 0 rgba(240,112,48,.4)}50%{box-shadow:0 0 0 5px rgba(240,112,48,0)}}
.step-dot.dot-upcoming{background:var(--panel2);border:1.5px solid var(--muted2);color:var(--muted2)}
.step-info{flex:1;min-width:0}
.step-name{font-size:13px;font-weight:600;color:var(--text)}
.step-item.s-upcoming .step-name{color:var(--muted)}
.step-tag{
  font-size:9.5px;font-family:'IBM Plex Mono',monospace;
  letter-spacing:.05em;text-transform:uppercase;margin-top:2px;
}
.step-tag.t-done{color:var(--green)}
.step-tag.t-current{color:var(--orange)}
.step-tag.t-upcoming{color:var(--muted2)}

/* ── INFO GRID ── */
.info-grid{
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:0 14px;margin-bottom:12px;
}
.info-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
}
.info-row:last-child{border-bottom:none}
.info-k{font-size:11.5px;color:var(--muted);font-weight:600;flex-shrink:0}
.info-v{font-size:12.5px;color:var(--text);text-align:end;font-weight:500;word-break:break-word}

/* ── NOTES ── */
.notes-box{
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:12px;
}
.notes-box .nk{
  display:block;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);margin-bottom:5px;
  font-family:'IBM Plex Mono',monospace;font-weight:700;
}
.notes-body{font-size:12.5px;color:var(--text2);line-height:1.65}
.meta-row{
  display:flex;justify-content:space-between;
  font-size:9.5px;color:var(--muted2);margin-top:8px;
  font-family:'IBM Plex Mono',monospace;padding:0 2px;
}

/* ── NOT FOUND ── */
.not-found-msg{text-align:center;font-size:13px;color:var(--muted);padding:20px 0 8px}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:rgba(20,15,40,0.95);
  border:1px solid rgba(139,106,240,0.45);color:#c0b0f8;
  padding:10px 20px;border-radius:10px;font-size:12.5px;
  pointer-events:none;opacity:0;white-space:nowrap;z-index:999;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  backdrop-filter:blur(8px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── CONTACT ── */
.contact{
  border-top:1px solid var(--line);
  padding:18px 24px 20px;text-align:center;
}
.contact .brand{
  font-weight:800;font-size:13px;color:var(--gold);
  letter-spacing:.04em;margin-bottom:8px;
}
.contact .crow{font-size:11.5px;color:var(--muted);margin:3px 0;direction:ltr}
.contact a{color:var(--muted);text-decoration:none;transition:color .15s}
.contact a:hover{color:var(--orange)}
footer{
  padding:10px 24px 18px;text-align:center;
  font-size:9.5px;color:var(--muted2);line-height:1.6;
}

/* ── WA BUTTON ── */
.wa-btn{
  position:fixed;bottom:24px;right:24px;width:52px;height:52px;
  border-radius:50%;background:#25d366;
  box-shadow:0 4px 16px rgba(37,211,102,.35);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;z-index:900;text-decoration:none;
  transition:transform .2s,box-shadow .2s;
}
.wa-btn:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(37,211,102,.5)}
.wa-btn svg{width:26px;height:26px;fill:#fff}
.wa-tip{
  position:absolute;right:60px;white-space:nowrap;
  background:rgba(10,22,40,.94);color:var(--text2);
  font-size:11.5px;font-weight:600;padding:6px 12px;
  border-radius:8px;border:1px solid var(--line2);
  pointer-events:none;opacity:0;transform:translateX(6px);
  transition:opacity .2s,transform .2s;
}
.wa-btn:hover .wa-tip{opacity:1;transform:translateX(0)}
</style>
</head>

<div class="card">
  <div class="card-bar"></div>
  <header>
    <div class="lang-toggle">
      <button id="btnAr" class="on">AR</button>
      <button id="btnEn">EN</button>

/* ===== AUDIO ===== */
var _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function tone(f,d,t,v,dl){
  try{var c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
  o.type=t||'sine';o.frequency.setValueAtTime(f,c.currentTime+(dl||0));
  g.gain.setValueAtTime(0.001,c.currentTime+(dl||0));g.gain.linearRampToValueAtTime(v,c.currentTime+(dl||0)+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(dl||0)+d);
  o.start(c.currentTime+(dl||0));o.stop(c.currentTime+(dl||0)+d+0.05);}catch(e){}
}
var sfx={
  key:   function(){tone(820,.04,'sine',.025);},
  found: function(){tone(523,.2,'sine',.07,0);tone(659,.2,'sine',.07,.11);tone(784,.3,'sine',.09,.22);},
  bad:   function(){tone(360,.18,'triangle',.06,0);tone(270,.26,'triangle',.06,.15);},
  stage: function(){tone(640,.07,'sine',.045);},
  stamp: function(){tone(110,.2,'sine',.12,0);tone(200,.1,'sine',.04,.06);}
};

/* ===== CSV ===== */
function parseCsv(txt){
  var rows=[],row=[],cur="",inq=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charCodeAt(i);
    if(inq){
      if(ch===34&&txt.charCodeAt(i+1)===34){cur+='"';i++;}
      else if(ch===34){inq=false;}
      else{cur+=txt[i];}
    }else{
      if(ch===34){inq=true;}
      else if(ch===44){row.push(cur);cur="";}
      else if(ch===10||ch===13){
        if(ch===13&&txt.charCodeAt(i+1)===10)i++;
        row.push(cur);rows.push(row);row=[];cur="";
      }else{cur+=txt[i];}
    }
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(v){return v.trim()!=="";});});
}
async function loadData(){
  var r=await fetch(CSV+'&t='+Date.now());
  if(!r.ok)throw new Error('fetch');
  var txt=await r.text();
  var rows=parseCsv(txt);
  var hdr=rows[0].map(function(h){return h.trim().toLowerCase();});
  return rows.slice(1).map(function(row){
    var o={};hdr.forEach(function(h,i){o[h]=(row[i]||'').trim();});return o;
  });
}
function findRec(rows,id){
  var n=(id||'').trim().toLowerCase();
  return rows.find(function(r){return (r['contractid']||'').trim().toLowerCase()===n;});
}
function esc(s){
  return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}

/* ===== TRACK HELPERS ===== */
function getTrack(rec){
  var hf=(rec['hasforeign']||'').trim().toLowerCase();
  return (hf==='yes'||hf==='نعم')?T_FOREIGN:T_NORMAL;
}
function getStepIdx(rec,track){
  var n=parseInt((rec['currentstep']||'1').trim(),10);
  if(isNaN(n)||n<1)n=1;
  if(n>track.length)n=track.length;
  return n-1;
}
function getPhases(track){
  var phases={},order=[];
  track.forEach(function(s,i){
    var ph=s[1];
    if(!phases[ph]){phases[ph]={num:ph,ar:s[2],en:s[3],steps:[]};order.push(ph);}
    phases[ph].steps.push({idx:i,ar:s[4],en:s[5],pct:s[6]});
  });
  return order.map(function(ph){return phases[ph];});
}

/* ===== TIMELINE BUILD ===== */
function buildTimeline(phases,activePhaseIdx){
  var n=phases.length;
  var pcts=phases.map(function(_,i){return n===1?50:Math.round(i/(n-1)*100);});

  var nodesHtml=phases.map(function(ph,i){
    var isDone=i<activePhaseIdx,isActive=i===activePhaseIdx;
    var cls='tl-node'+(isDone?' tl-done':isActive?' tl-active':'');
    var lbl=lang==='ar'?ph.ar:ph.en;
    if(lbl.length>10)lbl=lbl.substring(0,9)+'…';
    return '<div class="'+cls+'" data-pi="'+i+'" style="position:absolute;left:'+pcts[i]+'%;transform:translateX(-50%) translateY(-50%);top:50%">'+
      (isDone?'&#10003;':(i+1))+
      '<div class="tl-node-label">'+esc(lbl)+'</div>'+
    '</div>';
  }).join('');

  var fillPct=n===1?0:Math.round(activePhaseIdx/(n-1)*100);
  var pinLeft=pcts[activePhaseIdx];
  var pin='<div class="tl-pin" id="tlPin" style="left:'+pinLeft+'%">'+
    '<svg width="20" height="28" viewBox="0 0 20 28">'+
      '<path d="M10,1.5 C5.5,1.5 2,5 2,9.5 C2,16.5 10,26.5 10,26.5 C10,26.5 18,16.5 18,9.5 C18,5 14.5,1.5 10,1.5Z" fill="#f07030"/>'+
      '<circle cx="10" cy="9.5" r="3.5" fill="rgba(0,0,0,0.28)"/>'+
    '</svg>'+
  '</div>';

  return '<div class="timeline">'+
    '<div class="tl-track-wrap">'+
      '<div class="tl-fill" id="tlFill" style="width:'+fillPct+'%"></div>'+
      '<div class="tl-nodes">'+nodesHtml+'</div>'+
      pin+
    '</div>'+
  '</div>';
}

/* ===== PAGE CONTENT ===== */
function buildPageContent(phase,stepIdx,customLabel){
  var l=L();
  var isDonePhase=phase.steps.every(function(s){return s.idx<stepIdx;});
  var isActivePhase=phase.steps.some(function(s){return s.idx===stepIdx;});
  var phColor=isDonePhase?'var(--blue-l)':isActivePhase?'var(--orange)':'var(--muted2)';
  var phBg=isDonePhase?'rgba(91,159,214,0.1)':isActivePhase?'var(--orange-dim)':'rgba(58,74,92,0.15)';
  var phBorder=isDonePhase?'rgba(91,159,214,0.3)':isActivePhase?'rgba(240,112,48,0.3)':'rgba(58,74,92,0.2)';

  var stepsHtml=phase.steps.map(function(s){
    var isDone=s.idx<stepIdx,isCurr=s.idx===stepIdx;
    var name=(isCurr&&customLabel)?customLabel:(lang==='ar'?s.ar:s.en);
    var cls='step-item '+(isDone?'s-done':isCurr?'s-current':'s-upcoming');
    var dCls='step-dot '+(isDone?'dot-done':isCurr?'dot-current':'dot-upcoming');
    var dc=isDone?'&#10003;':isCurr?'&#9679;':'&#9675;';
    var tCls='step-tag '+(isDone?'t-done':isCurr?'t-current':'t-upcoming');
    var ttxt=isDone?l.done:isCurr?l.current:l.upcoming;
    return '<div class="'+cls+'">'+
      '<div class="'+dCls+'">'+dc+'</div>'+
      '<div class="step-info">'+
        '<div class="step-name">'+esc(name)+'</div>'+
        '<div class="'+tCls+'">'+ttxt+'</div>'+
      '</div></div>';
  }).join('');

  var phaseName=lang==='ar'?phase.ar:phase.en;
  return '<div class="page-block">'+
    '<div class="phase-chip" style="color:'+phColor+';background:'+phBg+';border:1px solid '+phBorder+'">'+esc(phaseName)+'</div>'+
    '<div class="steps-list">'+stepsHtml+'</div>'+
  '</div>';
}

/* ===== SWITCH PHASE ===== */
function switchPhase(idx){
  var out=document.getElementById('result');
  curPageIdx=idx;
  var phases=getPhases(curTrack);
  if(idx<0||idx>=phases.length)return;
  sfx.stage();

  /* update nodes */
  out.querySelectorAll('.tl-node').forEach(function(nd){
    var pi=parseInt(nd.getAttribute('data-pi'));
    nd.className='tl-node'+(pi<idx?' tl-done':pi===idx?' tl-active':'');
  });

  /* move pin + fill */
  var n=phases.length,pcts=phases.map(function(_,i){return n===1?50:Math.round(i/(n-1)*100);});
  var pin=out.querySelector('#tlPin');
  var fill=out.querySelector('#tlFill');
  if(pin)pin.style.left=pcts[idx]+'%';
  if(fill)fill.style.width=(n===1?0:Math.round(idx/(n-1)*100))+'%';

  /* swap content */
  var cl=(lastRec&&lastRec['steplabel'])||'';
  var content=buildPageContent(phases[idx],curStepIdx,cl);
  var contentEl=out.querySelector('#phaseContent');
  if(contentEl){contentEl.innerHTML=content;}
}

/* ===== RENDER RESULT ===== */
function renderResult(rec){
  var l=L(),out=document.getElementById('result');
  lastRec=rec;

  var rawStatus=(rec['status']||'').trim();
  var isCancelled=['cancel','ملغى','ملغي','void','terminated','expired']
    .some(function(w){return rawStatus.toLowerCase().indexOf(w)!==-1;});

  curTrack=getTrack(rec);
  curStepIdx=getStepIdx(rec,curTrack);
  var pct=curTrack[curStepIdx][6];
  var phases=getPhases(curTrack);

  /* find active phase index */
  var activePhaseIdx=0;
  phases.forEach(function(ph,i){
    if(ph.steps.some(function(s){return s.idx===curStepIdx;}))activePhaseIdx=i;
  });
  curPageIdx=activePhaseIdx;

  var clientName=(rec['clientname']||'').trim();
  var cid=(rec['contractid']||'').trim();
  var customLabel=(rec['steplabel']||'').trim();
  var curStep=curTrack[curStepIdx];
  var curPhaseName=lang==='ar'?curStep[2]:curStep[3];
  var curStepName=customLabel||(lang==='ar'?curStep[4]:curStep[5]);
  var pctCls=pct>=70?'hi':pct>=30?'mid':'lo';

  /* details */
  var pairs=[[l.cNo,cid]];
  var issueDate=(rec['issuedate']||'').trim();
  if(issueDate)pairs.push([l.iDate,issueDate]);
  pairs.push([l.status,rawStatus]);
  var resp=(rec['responsiblename']||rec['responsible']||'').trim();
  if(resp)pairs.push([l.resp,resp]);
  var nextS=(rec['nextstep']||'').trim();
  if(nextS)pairs.push([l.nextS,nextS]);

  var infoHtml='<div class="info-grid">'+
    pairs.map(function(p){return '<div class="info-row"><span class="info-k">'+esc(p[0])+'</span><span class="info-v">'+esc(p[1])+'</span></div>';}).join('')+
  '</div>';

  var notes=(rec['notes']||'').trim();
  var updated=(rec['lastupdated']||'').trim();
  var notesHtml=notes?'<div class="notes-box"><span class="nk">'+l.notes+'</span><div class="notes-body">'+esc(notes)+'</div></div>':'';
  var metaHtml=updated?'<div class="meta-row"><span>'+l.updated+'</span><span>'+esc(updated)+'</span></div>':'';

  /* welcome */
  var welcomeHtml='';
  if(clientName){
    welcomeHtml='<div class="welcome">'+
      '<div class="w-stars">⭐️⭐️⭐️</div>'+
      '<div class="w-id">'+esc(l.welcome(clientName,cid))+'</div>'+
      '<div class="w-msg">'+esc(l.wMsg)+'</div>'+
    '</div>';
  }

  /* seal */
  var sealCls=isCancelled?'bad':'ok';
  var sealTxt=isCancelled?l.cancelled:l.active;
  var sealHtml='<div class="seal-wrap"><div class="seal '+sealCls+'"><div class="seal-txt">'+esc(sealTxt)+'</div></div></div>';

  /* timeline */
  var tlHtml=buildTimeline(phases,activePhaseIdx);

  /* initial page content */
  var pageHtml='<div id="phaseContent">'+buildPageContent(phases[activePhaseIdx],curStepIdx,customLabel)+'</div>';

  out.innerHTML=welcomeHtml+sealHtml+
    '<div class="prog-section">'+
      '<div class="prog-head">'+
        '<span class="prog-label">'+l.progress+'</span>'+
        '<div class="prog-right">'+
          '<div class="prog-pct '+pctCls+'" id="pPct">0%</div>'+
          '<div class="prog-step-name">'+esc(curPhaseName)+' — '+esc(curStepName)+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="prog-bar-bg"><div class="prog-bar-fill" id="pFill"></div></div>'+
    '</div>'+
    tlHtml+pageHtml+infoHtml+notesHtml+metaHtml;

  /* animate progress */
  setTimeout(function(){
    var fill=out.querySelector('#pFill');
    var pEl=out.querySelector('#pPct');
    if(fill)fill.style.width=pct+'%';
    if(pEl){
      var cur=0;
      var iv=setInterval(function(){
        cur=Math.min(cur+Math.ceil(pct/38),pct);
        pEl.textContent=cur+'%';
        if(cur>=pct)clearInterval(iv);
      },22);
    }
  },380);

  /* node click handlers */
  out.querySelectorAll('.tl-node').forEach(function(nd){
    nd.addEventListener('click',function(){
      var pi=parseInt(nd.getAttribute('data-pi'));
      if(!isNaN(pi))switchPhase(pi);
    });
  });

  setTimeout(function(){sfx.stamp();},80);
  if(!isCancelled)setTimeout(function(){sfx.found();},280);
  else setTimeout(function(){sfx.bad();},280);
}

/* ===== LOOKUP ===== */
async function doLookup(){
  var l=L(),out=document.getElementById('result');
  var id=inp.value.trim();
  if(!id){out.innerHTML='<p class="not-found-msg">'+l.enter+'</p>';return;}
  out.innerHTML='<div class="loading"><div class="dots"><span></span><span></span><span></span></div><p style="font-size:12.5px;color:var(--muted)">'+l.checking+'...</p></div>';
  document.getElementById('btnLook').disabled=true;
  try{
    var rows=await loadData();
    var rec=findRec(rows,id);
    if(!rec){
      lastRec=null;sfx.bad();
      out.innerHTML='<div class="seal-wrap"><div class="seal warn"><div class="seal-txt">'+l.noRec+'<br><span style="font-size:9px;opacity:.7">'+l.nf+'</span></div></div></div>'+
        '<p class="not-found-msg">'+esc(l.noMatch(id))+'</p>';
    }else{renderResult(rec);}
  }catch(e){
    lastRec=null;
    out.innerHTML='<p style="font-size:12.5px;color:var(--red);text-align:center;margin-top:20px">'+l.err+'</p>';
  }finally{document.getElementById('btnLook').disabled=false;}
}

  if(id){inp.value=id;clr.classList.add('show');doLookup();}
