<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Verification - Invest Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1220;
    --panel:#121a2c;
    --panel-2:#182238;
    --line: rgba(255,255,255,0.09);
    --blue:#2e648a;
    --blue-light:#3d84b8;
    --orange:#f37028;
    --orange-dim:#c85a1e;
    --verified:#3aa374;
    --alert:#e05a4e;
    --muted:#8a93a8;
    --text:#eef1f7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1100px 480px at 50% -10%, rgba(46,100,138,0.22), transparent 60%),
      radial-gradient(800px 400px at 100% 100%, rgba(243,112,40,0.08), transparent 60%),
      var(--bg);
    font-family:'Tajawal', 'Inter', sans-serif;
    color:var(--text);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px;
  }
  html[dir="ltr"] body{ font-family:'Inter', sans-serif; }
  .card{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 40px 80px rgba(0,0,0,0.5);
    overflow:hidden;
    position:relative;
  }
  .card:before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg, var(--blue), var(--orange), var(--blue));
  }
  header{
    padding:34px 34px 22px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .langtoggle{
    position:absolute;
    top:16px;
    inset-inline-end:16px;
    display:flex;
    gap:4px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px;
  }
  .langtoggle button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:.03em;
    padding:5px 11px;
    border-radius:16px;
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:all .15s;
  }
  .langtoggle button.active{
    background:linear-gradient(90deg, var(--blue), var(--blue-light));
    color:#fff;
  }
  .logo{
    width:76px;
    height:76px;
    border-radius:50%;
    margin:0 auto 14px;
    display:block;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.4);
  }
  header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--orange);
  }
  header h1{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:25px;
    letter-spacing:-.01em;
    margin:8px 0 0;
    color:var(--text);
  }
  .panel{ padding:30px 34px 34px; }
  label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; letter-spacing:.02em; }
  input[type=text]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    background:var(--panel-2);
    color:var(--text);
    margin-bottom:16px;
    text-align:left;
    direction:ltr;
  }
  input[type=text]::placeholder{ color:#5b6478; }
  button.action{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:linear-gradient(90deg, var(--blue), var(--blue-light));
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    letter-spacing:.02em;
    font-family:inherit;
  }
  button.action:hover{ filter:brightness(1.1); }
  button.action:disabled{ opacity:.5; cursor:progress; }

  .result{ margin-top:24px; text-align:center; min-height:1px; }
  .seal{
    width:96px;height:96px;
    margin:0 auto 14px;
    border-radius:50%;
    border:3px solid currentColor;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.3;
    transform:scale(.4) rotate(-18deg);
    opacity:0;
    animation: stamp .45s cubic-bezier(.2,1.4,.4,1) forwards;
    box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 0 30px currentColor;
  }
  @keyframes stamp{
    0%{ transform:scale(.4) rotate(-18deg); opacity:0; }
    60%{ transform:scale(1.08) rotate(-6deg); opacity:1; }
    100%{ transform:scale(1) rotate(-4deg); opacity:1; }
  }
  .seal.ok{ color:var(--verified); }
  .seal.bad{ color:var(--alert); }
  .seal.neutral{ color:var(--orange); }

  .details{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    margin-top:6px;
  }

  .stagenav{
    display:flex;
    gap:8px;
    margin-top:18px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .stagenav button{
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--muted);
    cursor:pointer;
    transition:all .15s;
  }
  .stagenav button.active{
    background:linear-gradient(90deg, var(--blue), var(--blue-light));
    border-color:transparent;
    color:#fff;
  }
  .stagenav button:hover:not(.active){ color:var(--text); border-color:var(--blue-light); }

  .stageblock{ margin-top:16px; text-align:start; }
  .stageblock.hidden{ display:none; }

  .stagepill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--orange);
    background:rgba(243,112,40,0.12);
    border:1px solid rgba(243,112,40,0.35);
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:12px;
  }

  .statusbadge{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .statusbadge .dot{
    width:11px;height:11px;
    border-radius:50%;
    flex-shrink:0;
    background:var(--orange);
    box-shadow:0 0 10px var(--orange);
  }
  .statusbadge.done .dot{
    background:var(--verified);
    box-shadow:0 0 10px var(--verified);
  }
  .statusbadge .stxt{ flex:1; }
  .statusbadge .stxt .steplabel{
    font-size:14px;
    font-weight:700;
    color:var(--text);
  }
  .statusbadge .stxt .statuslabel{
    font-size:11.5px;
    color:var(--orange);
    margin-top:2px;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.03em;
  }
  .statusbadge.done .stxt .statuslabel{ color:var(--verified); }

  .infogrid{
    font-size:13px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 16px;
  }
  .infogrid div{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; }
  .infogrid div + div{ border-top:1px dashed var(--line); }
  .infogrid span.k{ color:var(--muted); font-weight:700; flex-shrink:0; }
  .infogrid span.v{ color:var(--text); text-align:end; }

  .notesbox{
    font-size:13px;
    color:var(--text);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-top:10px;
    line-height:1.6;
  }
  .notesbox .k{ display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; font-family:'IBM Plex Mono', monospace; }

  .metarow{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color:var(--muted);
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
  }

  .contact{
    border-top:1px solid var(--line);
    padding:22px 34px 26px;
    text-align:center;
  }
  .contact .brand{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--orange);
    letter-spacing:.02em;
    margin-bottom:10px;
  }
  .contact a{ color:var(--muted); text-decoration:none; }
  .contact a:hover{ color:var(--orange); }
  .contact .row{
    font-size:12.5px;
    color:var(--muted);
    margin:4px 0;
    direction:ltr;
  }
  footer{ padding:14px 34px 24px; text-align:center; font-size:11px; color:var(--muted); }
</style>
</head>

// --- tiny CSV parser (handles quoted commas) ---
function parseCSV(text){
  const rows = [];
  let row = [], cur = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { cur += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(cur); cur=""; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(cur); rows.push(row); row=[]; cur="";
      } else { cur += c; }
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.length && r.some(v => v.trim() !== ""));
}

let cachedRows = null;
async function loadSheet(){
  if(cachedRows) return cachedRows;
  const res = await fetch(CSV_URL);
  if(!res.ok) throw new Error("sheet_fetch_failed");
  const text = await res.text();
  const rows = parseCSV(text);
  const headers = rows[0].map(h => h.trim().toLowerCase());
  cachedRows = rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i]||"").trim());
    return obj;
  });
  return cachedRows;
}

function findContract(rows, id){
  const norm = (id||"").trim().toLowerCase();
  return rows.find(r => (r["contractid"]||"").trim().toLowerCase() === norm);
}

function sealHTML(cls, big, small){
  return `<div class="seal ${cls}"><div>${big}<br><span style="font-weight:400;font-size:10px">${small||""}</span></div></div>`;
}

function statusBadge(stepText, status){
  const L = t();
  const isDone = (status||"").trim().toLowerCase() === "done";
  const label = isDone ? L.done : L.pending;
  return `<div class="statusbadge ${isDone?'done':''}">
      <div class="dot"></div>
      <div class="stxt">
        <div class="steplabel">${escapeHtml(stepText||"—")}</div>
        <div class="statuslabel">${label}</div>
      </div>
    </div>`;
}

function stageInfoGrid(rec, n){
  const L = t();
  const loc = (rec[`stage${n}location`]||"").trim();
  const time = (rec[`stage${n}time`]||"").trim();
  const reqs = (rec[`stage${n}requirements`]||"").trim();
  let rows = "";
  if(loc)  rows += `<div><span class="k">${L.location}</span><span class="v">${escapeHtml(loc)}</span></div>`;
  if(time) rows += `<div><span class="k">${L.time}</span><span class="v">${escapeHtml(time)}</span></div>`;
  if(reqs) rows += `<div><span class="k">${L.requirements}</span><span class="v">${escapeHtml(reqs)}</span></div>`;
  return rows ? `<div class="infogrid">${rows}</div>` : "";
}

function buildStageBlock(rec, n, activeIndex){
  const step = (rec[`stage${n}step`]||"").trim();
  const status = (rec[`stage${n}status`]||"").trim();
  if(!step) return "";
  return `<div class="stageblock ${n===activeIndex?'':'hidden'}" data-stage="${n}">
      ${statusBadge(step, status)}
      ${stageInfoGrid(rec, n)}
    </div>`;
}

function buildStage1Block(rec, activeIndex){
  const L = t();
  const responsible = (rec["responsiblename"]||rec["responsible"]||"").trim();
  const stage = (rec["stage"]||rec["process"]||"").trim();
  const nextStep = (rec["nextstep"]||"").trim();
  const notes = (rec["notes"]||rec["details"]||"").trim();
  const lastUpdated = (rec["lastupdated"]||"").trim();
  const rawStatus = (rec["status"]||"").trim();

  let infoRows = `
     <div><span class="k">${L.contractNo}</span><span class="v">${escapeHtml(rec["contractid"]||"")}</span></div>
     <div><span class="k">${L.issueDate}</span><span class="v">${escapeHtml(rec["issuedate"]||"")}</span></div>
     <div><span class="k">${L.status}</span><span class="v">${escapeHtml(rawStatus)}</span></div>`;
  if(responsible){
    infoRows += `<div><span class="k">${L.responsible}</span><span class="v">${escapeHtml(responsible)}</span></div>`;
  }

  let body = `<div class="infogrid">${infoRows}</div>`;
  if(nextStep){
    body += `<div class="notesbox"><span class="k">${L.nextStep}</span>${escapeHtml(nextStep)}</div>`;
  }
  if(notes){
    body += `<div class="notesbox"><span class="k">${L.notes}</span>${escapeHtml(notes)}</div>`;
  }
  if(lastUpdated){
    body += `<div class="metarow"><span>${L.lastUpdated}</span><span>${escapeHtml(lastUpdated)}</span></div>`;
  }

  return `<div class="stageblock ${1===activeIndex?'':'hidden'}" data-stage="1">
      ${stage ? `<div class="stagepill">${L.stage}: ${escapeHtml(stage)}</div>` : ""}
      ${body}
    </div>`;
}

function switchStage(container, n){
  container.querySelectorAll(".stageblock").forEach(el=>{
    el.classList.toggle("hidden", el.getAttribute("data-stage") !== String(n));
  });
  container.querySelectorAll(".stagenav button").forEach(btn=>{
    btn.classList.toggle("active", btn.getAttribute("data-target") === String(n));
  });
}

function renderResult(rec){
  const L = t();
  const out = document.getElementById("resultStatus");
  const rawStatus = (rec["status"]||"").trim();
  const status = rawStatus.toLowerCase();
  const cancelledWords = ["cancel","الغى","الغي","void","terminated","expired","revoked"];
  const isCancelled = cancelledWords.some(w => status.includes(w));

  let unlockedStage = parseInt((rec["unlockedstage"]||"1").trim(), 10);
  if(![1,2,3].includes(unlockedStage)) unlockedStage = 1;

  const blocks = [];
  blocks.push({n:1, html: buildStage1Block(rec, unlockedStage)});
  if(unlockedStage >= 2){
    const b2 = buildStageBlock(rec, 2, unlockedStage);
    if(b2) blocks.push({n:2, html:b2});
  }
  if(unlockedStage >= 3){
    const b3 = buildStageBlock(rec, 3, unlockedStage);
    if(b3) blocks.push({n:3, html:b3});
  }

  let nav = "";
  if(blocks.length > 1){
    nav = `<div class="stagenav">` + blocks.map(b=>
      `<button data-target="${b.n}" class="${b.n===unlockedStage?'active':''}">${L.stageBtn(b.n)}</button>`
    ).join("") + `</div>`;
  }

  out.innerHTML = sealHTML(isCancelled?"bad":"ok", isCancelled?L.cancelled:L.active) +
    nav +
    blocks.map(b=>b.html).join("");

  if(blocks.length > 1){
    out.querySelectorAll(".stagenav button").forEach(btn=>{
      btn.addEventListener("click", ()=> switchStage(out, btn.getAttribute("data-target")));
    });
  }
}

// ---- Status lookup ----
document.getElementById("btnLookup").addEventListener("click", async ()=>{
  const L = t();
  const out = document.getElementById("resultStatus");
  const id = document.getElementById("idInput1").value.trim();
  if(!id){ out.innerHTML = `<div class="msg">${L.enterId}</div>`; return; }
  out.innerHTML = `<div class="msg">${L.btnChecking}</div>`;
  try{
    const rows = await loadSheet();
    const rec = findContract(rows, id);
    if(!rec){
      lastRec = null;
      out.innerHTML = sealHTML("neutral", L.noRecord, L.notFound) +
        `<div class="msg">${L.noMatch(escapeHtml(id))}</div>`;
      return;
    }
    lastRec = rec;
    renderResult(rec);
  }catch(e){
    lastRec = null;
    out.innerHTML = `<div class="msg">${L.fetchError}</div>`;
  }
});

// ---- auto-fill from ?id= in URL ----
(function(){
  applyStaticText();
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if(id){
    document.getElementById("idInput1").value = id;
    document.getElementById("btnLookup").click();
  }
})();

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
