<!DOCTYPE html>
<html lang="ar" dir="rtl" id="R">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>متابعة الطلب — Invest Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060e1c;--card:#0a1628;--panel:#0f1f35;--panel2:#132540;
  --line:rgba(255,255,255,0.06);--line2:rgba(255,255,255,0.11);
  --gold:#c9a24a;--bl:#2563a8;--bll:#5b9fd6;--or:#f07030;
  --or-d:rgba(240,112,48,.12);--gn:#28c47a;--gn-d:rgba(40,196,122,.12);
  --rd:#e04040;--mu:#6a7a90;--mu2:#3a4a5c;--tx:#edf2f8;--tx2:#a8bcd0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Tajawal','Inter',sans-serif;color:var(--tx);
  background:var(--bg);display:flex;align-items:flex-start;justify-content:center;
  padding:20px 10px 80px;-webkit-font-smoothing:antialiased;}
html[dir=ltr] body{font-family:'Inter','Tajawal',sans-serif;}

.card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line2);border-radius:20px;overflow:hidden;}
.card-bar{height:3px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--or) 50%,var(--bll) 80%,transparent);}

header{padding:24px 24px 18px;text-align:center;border-bottom:1px solid var(--line);position:relative;
  background:radial-gradient(ellipse 260px 70px at 50% 0%,rgba(37,99,168,.1),transparent);}
.ltg{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:2px;
  background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:2px;}
.ltg button{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.06em;padding:4px 9px;border-radius:14px;border:none;
  background:transparent;color:var(--mu);cursor:pointer;transition:all .18s;}
.ltg button.on{background:linear-gradient(135deg,var(--bl),var(--bll));color:#fff;}
.emb{width:72px;height:72px;margin:0 auto 10px;position:relative;display:flex;align-items:center;justify-content:center;}
.emb::before{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(201,162,74,.3);}
.emb img{width:64px;height:64px;border-radius:50%;position:relative;z-index:1;box-shadow:0 4px 18px rgba(0,0,0,.55);}
.ey{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
header h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px;}
header .hs{font-size:12px;color:var(--mu);}

.panel{padding:20px 22px 24px;}
.fl{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;}
.iw{position:relative;margin-bottom:12px;}
.iw input{width:100%;padding:11px 40px 11px 13px;border:1px solid var(--line2);border-radius:9px;
  font-family:'IBM Plex Mono',monospace;font-size:13.5px;background:var(--panel2);color:var(--tx);
  direction:ltr;text-align:left;outline:none;transition:border-color .2s,box-shadow .2s;}
html[dir=rtl] .iw input{padding:11px 13px 11px 40px;}
.iw input:focus{border-color:var(--bll);box-shadow:0 0 0 3px rgba(91,159,214,.1);}
.iw input::placeholder{color:var(--mu2);}
.btn-clr{position:absolute;top:50%;right:11px;transform:translateY(-50%);
  background:none;border:none;color:var(--mu);cursor:pointer;font-size:14px;padding:4px;display:none;}
html[dir=rtl] .btn-clr{right:auto;left:11px;}
.btn-clr:hover{color:var(--tx);}
.btn-clr.v{display:block;}
.btn-go{width:100%;padding:12px;border:none;border-radius:9px;
  background:linear-gradient(135deg,var(--bl),var(--bll));color:#fff;
  font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.03em;
  transition:transform .1s,box-shadow .2s;box-shadow:0 4px 16px rgba(37,99,168,.28);}
.btn-go:hover{box-shadow:0 6px 22px rgba(37,99,168,.42);}
.btn-go:active{transform:scale(.99);}
.btn-go:disabled{opacity:.5;cursor:progress;}

.loading{text-align:center;padding:32px 0;}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:11px;}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--bll);animation:dp 1.3s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.2s;}
.dots span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{transform:scale(.5);opacity:.4;}40%{transform:scale(1);opacity:1;}}
.ltxt{font-size:12px;color:var(--mu);}

.out{margin-top:18px;}
@keyframes fu{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── WELCOME BANNER ── */
.welcome{
  border-radius:16px;padding:28px 22px 24px;margin-bottom:18px;
  text-align:center;animation:fu .5s ease-out;
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(37,99,168,.2) 0%,rgba(201,162,74,.1) 50%,rgba(37,99,168,.15) 100%);
  border:1px solid rgba(201,162,74,.25);
}
.welcome::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 200px 80px at 50% -5%,rgba(201,162,74,.12),transparent);
  pointer-events:none;
}
.welcome::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  animation:shine 3s ease-in-out infinite;
}
@keyframes shine{0%{left:-100%;}60%,100%{left:150%;}}
.w-stars{font-size:22px;margin-bottom:10px;letter-spacing:6px;animation:fu .4s ease-out;}
.w-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;
  color:var(--gold);margin-bottom:8px;text-transform:uppercase;opacity:.85;
}
.w-name{
  font-size:24px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--tx) 30%,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:6px;line-height:1.2;
}
.w-msg{font-size:13px;color:var(--tx2);line-height:1.6;}
.w-divider{width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px auto 10px;}
.w-contract{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:.08em;}

/* ── COMPLETION BANNER (100%) ── */
.complete-banner{
  border-radius:16px;padding:28px 22px;margin-bottom:18px;text-align:center;
  animation:fu .5s ease-out;position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(40,196,122,.18),rgba(40,196,122,.06));
  border:1px solid rgba(40,196,122,.35);
}
.complete-banner::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 220px 90px at 50% -5%,rgba(40,196,122,.15),transparent);
  pointer-events:none;
}
.cb-emoji{font-size:44px;margin-bottom:10px;display:block;animation:popIn .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(0) rotate(-20deg);}to{transform:scale(1) rotate(0);}}
.cb-title{font-size:22px;font-weight:800;color:var(--gn);margin-bottom:6px;letter-spacing:-.01em;}
.cb-name{font-size:16px;color:var(--tx2);margin-bottom:12px;}
.cb-msg{font-size:13px;color:var(--tx2);line-height:1.65;}
.cb-stars{font-size:20px;letter-spacing:5px;margin-top:10px;}

/* ── SEAL ── */
.seal-wrap{text-align:center;margin-bottom:14px;}
.seal{display:inline-flex;align-items:center;justify-content:center;
  width:74px;height:74px;border-radius:50%;position:relative;
  animation:si .5s cubic-bezier(.18,1.4,.4,1) forwards;opacity:0;transform:scale(.15) rotate(-25deg);}
@keyframes si{0%{opacity:0;transform:scale(.15) rotate(-25deg);}65%{opacity:1;transform:scale(1.07) rotate(-4deg);}100%{opacity:1;transform:scale(1) rotate(-4deg);}}
.seal::before{content:'';position:absolute;inset:0;border-radius:50%;border:2.5px solid currentColor;}
.seal::after{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid currentColor;opacity:.3;}
.seal-txt{position:relative;z-index:1;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:1.3;}
.seal.ok{color:var(--gn);filter:drop-shadow(0 0 13px rgba(40,196,122,.28));}
.seal.done{color:var(--gold);filter:drop-shadow(0 0 16px rgba(201,162,74,.4));}
.seal.bad{color:var(--rd);filter:drop-shadow(0 0 11px rgba(224,64,64,.22));}
.seal.warn{color:var(--gold);filter:drop-shadow(0 0 11px rgba(201,162,74,.2));}

/* ── PROGRESS ── */
.prog-sec{margin-bottom:20px;}
.prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.prog-lbl{font-size:10px;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;}
.prog-pct{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;line-height:1;transition:color .5s;}
.prog-pct.hi{color:var(--gn);}.prog-pct.mid{color:var(--or);}.prog-pct.lo{color:var(--bll);}
.prog-pct.done-pct{color:var(--gold);}
.prog-stage{font-size:12.5px;color:var(--tx2);margin-bottom:12px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;line-height:1.5;}
.stage-current{font-size:13.5px;font-weight:700;color:var(--tx);display:block;margin-bottom:2px;}
.stage-status{font-size:9.5px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--or);}
.stage-status.done-status{color:var(--gn);}

/* ── JOURNEY ── */
.journey{position:relative;height:72px;margin:16px 0 10px;}
.journey-line{position:absolute;top:50%;left:10px;right:10px;height:3px;transform:translateY(-50%);background:var(--line2);border-radius:3px;}
.journey-fill{position:absolute;top:0;left:0;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--bl),var(--bll) 50%,var(--gn));
  width:0%;transition:width 1.2s cubic-bezier(.4,0,.2,1);position:relative;}
.journey-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:16px;
  background:rgba(255,255,255,.2);border-radius:3px;animation:sh 1.5s ease-in-out infinite;}
@keyframes sh{0%,100%{opacity:0;}50%{opacity:1;}}
.journey-dot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);}
.journey-dot.start{left:10px;background:var(--gn);box-shadow:0 0 0 3px rgba(40,196,122,.2);}
.journey-dot.end{right:10px;background:var(--mu2);}
.journey-dot.end.complete{background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,74,.25);animation:endglow 1.5s ease-in-out infinite;}
@keyframes endglow{0%,100%{box-shadow:0 0 0 3px rgba(201,162,74,.2);}50%{box-shadow:0 0 0 7px rgba(201,162,74,.05);}}
.journey-label-start{position:absolute;top:calc(50% + 13px);left:4px;font-size:9px;color:var(--gn);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;white-space:nowrap;}
.journey-label-end{position:absolute;top:calc(50% + 13px);right:4px;font-size:9px;color:var(--mu2);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;white-space:nowrap;text-align:end;}
.journey-label-end.complete{color:var(--gold);}
.journey-pin-label{position:absolute;top:calc(50% - 40px);transform:translateX(-50%);
  background:var(--or);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;
  border-radius:20px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 2px 8px rgba(240,112,48,.4);transition:left .9s cubic-bezier(.4,0,.2,1);
  animation:labelPop .4s ease-out;}
.journey-pin-label.done-label{background:var(--gold);box-shadow:0 2px 8px rgba(201,162,74,.4);}
@keyframes labelPop{from{opacity:0;transform:translateX(-50%) scale(.8);}to{opacity:1;transform:translateX(-50%) scale(1);}}
.journey-pin-label::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid var(--or);}
.journey-pin-label.done-label::after{border-top-color:var(--gold);}
.journey-pin{position:absolute;top:50%;transform:translateX(-50%) translateY(-100%);
  transition:left .9s cubic-bezier(.34,1.4,.64,1);z-index:10;pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(240,112,48,.55));}
.journey-pin svg{display:block;}
.journey-pin.done-pin{filter:drop-shadow(0 4px 12px rgba(201,162,74,.6));}

/* ── INFO CARD ── */
.info-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:10px;}
.ir{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.ir:last-child{border-bottom:none;}
.ik{font-size:11px;color:var(--mu);font-weight:600;flex-shrink:0;padding-top:1px;}
.iv{font-size:12.5px;color:var(--tx);text-align:end;font-weight:500;line-height:1.5;}

/* ── NEXT STEP BOX ── */
.nextstep-box{background:linear-gradient(135deg,rgba(37,99,168,.12),rgba(37,99,168,.06));
  border:1px solid rgba(91,159,214,.25);border-radius:10px;padding:13px 14px;margin-bottom:10px;}
.nextstep-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--bll);font-family:'IBM Plex Mono',monospace;font-weight:700;margin-bottom:5px;display:block;}
.nextstep-text{font-size:13px;color:var(--tx);line-height:1.6;font-weight:500;}

/* ── NOTES BOX ── */
.nbox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:10px;}
.nk{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);
  margin-bottom:5px;font-family:'IBM Plex Mono',monospace;font-weight:700;}
.nbody{font-size:12.5px;color:var(--tx2);line-height:1.65;}
.nfmsg{text-align:center;font-size:12.5px;color:var(--mu);padding:18px 0 6px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(60px);
  background:rgba(18,12,36,.95);border:1px solid rgba(139,106,240,.4);color:#c0b0f8;
  padding:9px 18px;border-radius:9px;font-size:12px;pointer-events:none;opacity:0;
  white-space:nowrap;z-index:999;transition:all .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(8px);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── CONFETTI PARTICLES ── */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:990;overflow:hidden;}
.cp{position:absolute;width:8px;height:8px;border-radius:2px;animation:cf linear forwards;}
@keyframes cf{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

.contact{border-top:1px solid var(--line);padding:16px 22px 18px;text-align:center;}
.contact .brand{font-weight:800;font-size:12.5px;color:var(--gold);letter-spacing:.04em;margin-bottom:7px;}
.contact .crow{font-size:11px;color:var(--mu);margin:3px 0;direction:ltr;}
.contact a{color:var(--mu);text-decoration:none;transition:color .15s;}
.contact a:hover{color:var(--or);}
footer{padding:8px 22px 16px;text-align:center;font-size:9px;color:var(--mu2);line-height:1.6;}
.wa-btn{position:fixed;bottom:22px;right:22px;width:50px;height:50px;border-radius:50%;
  background:#25d366;box-shadow:0 4px 14px rgba(37,211,102,.32);display:flex;
  align-items:center;justify-content:center;cursor:pointer;border:none;z-index:900;text-decoration:none;
  transition:transform .2s,box-shadow .2s;}
.wa-btn:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(37,211,102,.48);}
.wa-btn svg{width:25px;height:25px;fill:#fff;}
.wa-tip{position:absolute;right:58px;white-space:nowrap;background:rgba(8,18,36,.94);
  color:var(--tx2);font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;
  border:1px solid var(--line2);pointer-events:none;opacity:0;transform:translateX(5px);
  transition:opacity .2s,transform .2s;}
.wa-btn:hover .wa-tip{opacity:1;transform:translateX(0);}
</style>
</head>

function launchConfetti(){
  var colors=['#f07030','#c9a24a','#28c47a','#5b9fd6','#e04040','#fff'];
  var wrap=document.createElement('div');wrap.className='confetti-wrap';
  document.body.appendChild(wrap);
  for(var i=0;i<80;i++){
    (function(i){
      setTimeout(function(){
        var el=document.createElement('div');el.className='cp';
        el.style.left=Math.random()*100+'%';
        el.style.background=colors[Math.floor(Math.random()*colors.length)];
        el.style.animationDuration=(1.5+Math.random()*2)+'s';
        el.style.animationDelay='0s';
        el.style.width=(6+Math.random()*8)+'px';
        el.style.height=(6+Math.random()*8)+'px';
        wrap.appendChild(el);
      },i*30);
    })(i);
  }
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);},5000);
}

/* ===== CSV ===== */
function parseCsv(txt){
  var rows=[],row=[],cur='',inq=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charCodeAt(i);
    if(inq){if(ch===34&&txt.charCodeAt(i+1)===34){cur+='"';i++;}else if(ch===34){inq=false;}else{cur+=txt[i];}}
    else{if(ch===34){inq=true;}else if(ch===44){row.push(cur);cur='';}
    else if(ch===10||ch===13){if(ch===13&&txt.charCodeAt(i+1)===10)i++;row.push(cur);rows.push(row);row=[];cur='';}
    else{cur+=txt[i];}}
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(v){return v.trim()!=='';});});
}
async function load(){
  /* 1) Try admin tool localStorage first */
  try{
    var local=localStorage.getItem('ig_verify_data');
    if(local){
      var parsed=JSON.parse(local);
      if(Array.isArray(parsed)&&parsed.length) return parsed;
    }
  }catch(e){}
  /* 2) Fall back to Google Sheet */
  var r=await fetch(CSV+'&t='+Date.now());
  if(!r.ok)throw new Error('net');
  var txt=await r.text();
  var rows=parseCsv(txt);
  var hdr=rows[0].map(function(h){return h.trim().toLowerCase();});
  return rows.slice(1).map(function(r){var o={};hdr.forEach(function(h,i){o[h]=(r[i]||'').trim();});return o;});
}
function find(rows,id){
  var n=id.trim().toLowerCase();
  return rows.find(function(r){return (r['contractid']||'').trim().toLowerCase()===n;});
}
function esc(s){return (s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ===== RENDER ===== */
function render(rec){
  var l=L(),out=document.getElementById('out');
  lastRec=rec;

  var rawStatus=(rec['status']||'').trim();
  var isCancelled=['cancel','\u0645\u0644\u063a\u0649','\u0645\u0644\u063a\u064a','void','terminated'].some(function(w){return rawStatus.toLowerCase().indexOf(w)!==-1;});

  var cid=(rec['contractid']||'').trim();
  var cname=(rec['clientname']||'').trim();
  var stage=(rec['currentstage']||rec['currentstep']||'').trim();
  var pct=Math.max(0,Math.min(100,parseInt(rec['progress']||'0')||0));
  var resp=(rec['responsiblename']||rec['responsible']||'').trim();
  var notes=(rec['notes']||'').trim();
  var nextStep=(rec['nextstep']||'').trim();
  var issueDate=(rec['issuedate']||'').trim();
  var isDone=pct>=100;

  /* ── WELCOME ── */
  var welcomeHtml='';
  if(cname){
    welcomeHtml='<div class="welcome">'+
      '<div class="w-stars">\u2b50\ufe0f \u2728 \u2b50\ufe0f</div>'+
      '<div class="w-eyebrow">'+esc(l.wEyebrow(cid))+'</div>'+
      '<div class="w-name">'+esc(l.wHi(cname))+'</div>'+
      '<div class="w-divider"></div>'+
      '<div class="w-msg">'+esc(l.wMsg)+'</div>'+
      '<div class="w-contract">'+esc(cid)+'</div>'+
    '</div>';
  }

  /* ── COMPLETION BANNER ── */
  var completeBanner='';
  if(isDone){
    completeBanner='<div class="complete-banner">'+
      '<span class="cb-emoji">\ud83c\udf89</span>'+
      '<div class="cb-title">'+l.cbTitle+'</div>'+
      (cname?'<div class="cb-name">'+esc(cname)+'</div>':'')+
      '<div class="cb-msg">'+esc(l.cbMsg)+'</div>'+
      '<div class="cb-stars">\u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f</div>'+
    '</div>';
  }

  /* ── SEAL ── */
  var sealCls=isDone?'done':isCancelled?'bad':'ok';
  var sealTxt=isDone?l.done:isCancelled?l.cancelled:l.active;
  var seal='<div class="seal-wrap"><div class="seal '+sealCls+'"><div class="seal-txt">'+esc(sealTxt)+'</div></div></div>';

  /* ── PROGRESS ── */
  var pctCls=isDone?'done-pct':pct>=70?'hi':pct>=30?'mid':'lo';
  var stageBox=stage?'<div class="prog-stage">'+
    '<span class="stage-current">'+esc(stage)+'</span>'+
    '<span class="stage-status'+(isDone?' done-status':'')+'">'+
      (isDone?l.done:l.inProgress)+
    '</span></div>':'';
  var progHtml='<div class="prog-sec">'+
    '<div class="prog-head"><span class="prog-lbl">'+l.prog+'</span>'+
    '<div class="prog-pct '+pctCls+'" id="pPct">0%</div></div>'+
    stageBox+'</div>';

  /* ── JOURNEY ── */
  var pinLeft=pct;
  var journeyHtml='<div class="journey">'+
    '<div class="journey-line"><div class="journey-fill" id="jFill" style="width:0%"></div></div>'+
    '<div class="journey-dot start"></div>'+
    '<div class="journey-dot end'+(isDone?' complete':'')+'"></div>'+
    '<div class="journey-label-start">'+l.startLbl+'</div>'+
    '<div class="journey-label-end'+(isDone?' complete':'')+'">'+l.endLbl+'</div>'+
    (stage?'<div class="journey-pin-label'+(isDone?' done-label':'')+'" id="jLabel" style="left:'+pinLeft+'%">'+esc(stage)+'</div>':'')+
    '<div class="journey-pin'+(isDone?' done-pin':'')+'" id="jPin" style="left:'+pinLeft+'%">'+
      '<svg width="20" height="28" viewBox="0 0 20 28">'+
        '<path d="M10,1C5.5,1 2,4.5 2,8.5C2,15.5 10,27 10,27C10,27 18,15.5 18,8.5C18,4.5 14.5,1 10,1Z" fill="'+(isDone?'#c9a24a':'#f07030')+'"/>'+
        '<circle cx="10" cy="8.5" r="3.2" fill="rgba(0,0,0,0.25)"/>'+
      '</svg>'+
    '</div>'+
  '</div>';

  /* ── INFO ── */
  var infoRows='<div class="ir"><span class="ik">'+l.cNo+'</span><span class="iv">'+esc(cid)+'</span></div>';
  if(issueDate) infoRows+='<div class="ir"><span class="ik">'+l.iDate+'</span><span class="iv">'+esc(issueDate)+'</span></div>';
  infoRows+='<div class="ir"><span class="ik">'+l.status+'</span><span class="iv">'+esc(rawStatus)+'</span></div>';
  if(resp) infoRows+='<div class="ir"><span class="ik">'+l.resp+'</span><span class="iv">'+esc(resp)+'</span></div>';
  var infoHtml='<div class="info-card">'+infoRows+'</div>';

  var nextHtml=nextStep?'<div class="nextstep-box"><span class="nextstep-label">'+l.nextStep+'</span><div class="nextstep-text">'+esc(nextStep)+'</div></div>':'';
  var notesHtml=notes?'<div class="nbox"><span class="nk">'+l.notes+'</span><div class="nbody">'+esc(notes)+'</div></div>':'';

  out.innerHTML=welcomeHtml+(isDone?completeBanner:seal+progHtml+journeyHtml)+infoHtml+nextHtml+notesHtml;

  /* ── ANIMATE ── */
  setTimeout(function(){
    var fill=document.getElementById('jFill');
    var pin=document.getElementById('jPin');
    var label=document.getElementById('jLabel');
    if(fill)fill.style.width=pct+'%';
    if(pin)pin.style.left=pct+'%';
    if(label)label.style.left=pct+'%';
  },400);

  setTimeout(function(){
    var pEl=document.getElementById('pPct');
    if(pEl){var c=0;var iv=setInterval(function(){c=Math.min(c+Math.ceil(pct/36),pct);pEl.textContent=c+'%';if(c>=pct)clearInterval(iv);},22);}
  },380);

  setTimeout(function(){sfx.thud();},80);
  if(isDone){
    setTimeout(function(){sfx.complete();launchConfetti();},300);
  }else if(!isCancelled){
    setTimeout(function(){sfx.ok();},280);
  }else{
    setTimeout(function(){sfx.bad();},280);
  }
}

/* ===== LOOKUP ===== */
async function go(){
  var l=L(),out=document.getElementById('out');
  var id=inp.value.trim();
  if(!id){out.innerHTML='<p class="nfmsg">'+l.noId+'</p>';return;}
  out.innerHTML='<div class="loading"><div class="dots"><span></span><span></span><span></span></div><p class="ltxt">'+l.chk+'...</p></div>';
  document.getElementById('btnGo').disabled=true;
  try{
    var rows=await load();
    var rec=find(rows,id);
    if(!rec){
      lastRec=null;sfx.bad();
      out.innerHTML='<div class="seal-wrap"><div class="seal warn"><div class="seal-txt">'+l.noRec+'<br><small>'+l.nf+'</small></div></div></div><p class="nfmsg">'+esc(l.noMatch(id))+'</p>';
    }else{render(rec);}
  }catch(e){
    lastRec=null;
    out.innerHTML='<p style="color:var(--rd);text-align:center;margin-top:20px;font-size:13px">'+l.err+'</p>';
  }finally{document.getElementById('btnGo').disabled=false;}
}
