<!DOCTYPE html>
<html lang="ar" dir="rtl" id="R">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>تتبع عقدي — Invest Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --or:#F47920;--or2:#e06810;--or3:#ff8c38;
  --or-bg:rgba(244,121,32,0.08);--or-line:rgba(244,121,32,0.25);
  --navy:#0d1b2a;--navy2:#152236;--navy3:#1e3147;
  --gold:#C8972B;--gold-bg:rgba(200,151,43,0.1);
  --gn:#00875A;--gn-bg:#E3F5EF;--gn2:#00A36C;
  --tx:#1a1a2e;--tx2:#4a5568;--tx3:#94a3b8;
  --bg:#f8f9fb;--card:#ffffff;
  --line:#e8ecf0;--line2:#f0f3f6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{font-family:'Tajawal','Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
html[dir=ltr] body{font-family:'Inter','Tajawal',sans-serif;}

/* ── NAVBAR (matches site) ── */
.nav{
  background:var(--navy);
  padding:0 18px;height:60px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:50;
}
.nav-logo{
  width:38px;height:38px;border-radius:50%;
  background:#fff;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(244,121,32,.4);
}
.nav-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.nav-brand{
  font-size:15px;font-weight:800;color:#fff;
  letter-spacing:.01em;line-height:1.1;
}
.nav-tag{font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;display:block;}
.nav-lang{
  margin-right:auto;
  display:flex;gap:2px;background:rgba(255,255,255,.1);
  border-radius:14px;padding:2px;
}
.lb{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;
  padding:3px 9px;border-radius:11px;border:none;
  background:transparent;color:rgba(255,255,255,.65);cursor:pointer;
  letter-spacing:.05em;transition:all .14s;}
.lb.on{background:var(--or);color:#fff;}

/* ── HERO (orange gradient like site) ── */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 45%,var(--navy3) 100%);
  padding:28px 18px 32px;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-40px;left:-40px;
  width:180px;height:180px;border-radius:50%;
  background:rgba(244,121,32,.12);
}
.hero::after{
  content:'';position:absolute;bottom:-20px;right:-20px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(200,151,43,.08);
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(244,121,32,.15);border:1px solid rgba(244,121,32,.3);
  border-radius:20px;padding:4px 12px;
  font-size:10px;font-weight:700;color:var(--or3);
  letter-spacing:.06em;text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;margin-bottom:14px;
}
.hero-eyebrow::before{content:'●';font-size:8px;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.hero-title{font-size:21px;font-weight:800;color:#fff;
  margin-bottom:5px;letter-spacing:-.01em;line-height:1.25;}
.hero-sub{font-size:12.5px;color:rgba(255,255,255,.65);margin-bottom:20px;line-height:1.55;}
.hero-inp{
  display:flex;gap:0;border-radius:10px;overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.25);
}
.hero-inp input{
  flex:1;height:48px;padding:0 14px;border:none;
  font-family:'IBM Plex Mono',monospace;font-size:13.5px;
  color:var(--tx);background:#fff;outline:none;
  direction:ltr;text-align:left;
}
html[dir=rtl] .hero-inp input{padding:0 14px;direction:rtl;text-align:right;}
.hero-inp input::placeholder{color:#b0b8c8;font-family:'Tajawal',sans-serif;}
.hero-inp .btn-go{
  width:54px;height:48px;background:var(--or);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0;
}
.hero-inp .btn-go:hover{background:var(--or2);}
.hero-inp .btn-go svg{width:20px;height:20px;fill:#fff;}
.hero-inp .btn-go:disabled{opacity:.6;cursor:progress;}
.hero-clr{
  position:absolute;/* handled differently */
  display:none;
}
.inp-wrap{position:relative;flex:1;}
.inp-wrap .clr-btn{
  position:absolute;top:50%;right:10px;transform:translateY(-50%);
  background:none;border:none;color:#aaa;cursor:pointer;
  font-size:14px;padding:4px;display:none;z-index:2;
}
html[dir=rtl] .inp-wrap .clr-btn{right:auto;left:10px;}
.inp-wrap .clr-btn.v{display:block;}

/* ── RESULT AREA ── */
.res{padding:16px 14px 0;}

/* ── LOADING ── */
.loading{text-align:center;padding:36px 0;}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:10px;}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--or);
  animation:dp 1.3s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.2s;}
.dots span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{transform:scale(.45);opacity:.3;}40%{transform:scale(1);opacity:1;}}
.ltxt{font-size:12px;color:var(--tx3);}

/* ── WELCOME CARD ── */
.wc{
  background:var(--navy);border-radius:16px;
  padding:20px 18px;margin-bottom:14px;
  position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(13,27,42,.2);
}
.wc::before{content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(244,121,32,.12);}
.wc-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--or3);margin-bottom:6px;}
.wc-name{font-size:21px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-.01em;}
.wc-msg{font-size:12px;color:rgba(255,255,255,.65);line-height:1.6;margin-bottom:10px;}
.wc-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(244,121,32,.15);border:1px solid rgba(244,121,32,.3);
  border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:var(--or3);
}
.wc-badge::before{content:'★';color:var(--gold);}

/* ── COMPLETE CARD ── */
.cc{
  background:linear-gradient(135deg,var(--gn) 0%,var(--gn2) 100%);
  border-radius:16px;padding:24px 18px;margin-bottom:14px;
  text-align:center;color:#fff;
  box-shadow:0 6px 24px rgba(0,135,90,.28);
  position:relative;overflow:hidden;
}
.cc::before{content:'';position:absolute;top:-20px;right:-20px;
  width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07);}
.cc-ico{font-size:44px;display:block;margin-bottom:10px;
  animation:popIn .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(0);}to{transform:scale(1);}}
.cc-ttl{font-size:20px;font-weight:800;margin-bottom:4px;}
.cc-nm{font-size:13px;opacity:.9;margin-bottom:10px;}
.cc-msg{font-size:12px;opacity:.82;line-height:1.65;}
.cc-stars{font-size:17px;margin-top:10px;letter-spacing:4px;}

/* ── STATUS ROW ── */
.status-row{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border-radius:12px;padding:12px 14px;
  margin-bottom:14px;border:1px solid var(--line);
  box-shadow:0 1px 6px rgba(0,0,0,.04);}
.stat-chip{display:inline-flex;align-items:center;gap:6px;
  padding:5px 13px;border-radius:20px;font-size:11.5px;font-weight:700;}
.chip-or{background:rgba(244,121,32,.1);color:var(--or2);border:1px solid rgba(244,121,32,.25);}
.chip-gn{background:var(--gn-bg);color:var(--gn);border:1px solid rgba(0,135,90,.25);}
.chip-gy{background:#f8f8f8;color:#888;border:1px solid #ddd;}
.chip-rd{background:#fff0f0;color:#c0392b;border:1px solid #fad2d2;}
.cdot{width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:cd 2s ease-in-out infinite;}
@keyframes cd{0%,100%{opacity:1;}50%{opacity:.3;}}
.stat-id{font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--tx3);font-weight:600;letter-spacing:.05em;}

/* ── PROGRESS CARD ── */
.prog-card{background:var(--card);border-radius:14px;padding:18px;
  margin-bottom:14px;border:1px solid var(--line);
  box-shadow:0 1px 6px rgba(0,0,0,.04);}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.pc-label{font-size:10px;font-weight:700;color:var(--tx3);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;}
.pc-stage{font-size:13px;font-weight:700;color:var(--tx);line-height:1.3;}
.pc-pct{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:800;
  line-height:1;color:var(--or);transition:color .4s;}
.pc-pct.hi{color:var(--gn);}
.bar-bg{height:8px;background:var(--line2);border-radius:8px;overflow:hidden;margin-bottom:6px;}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--or),var(--or3));
  width:0%;transition:width 1.2s cubic-bezier(.4,0,.2,1);position:relative;}
.bar-fill.hi{background:linear-gradient(90deg,var(--gn),var(--gn2));}
.bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;
  width:18px;background:rgba(255,255,255,.4);border-radius:8px;
  animation:sh 1.5s ease-in-out infinite;}
@keyframes sh{0%,100%{opacity:0;}50%{opacity:1;}}
.bar-lbr{display:flex;justify-content:space-between;
  font-size:9.5px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;margin-top:2px;}

/* ── STEPS (orange accent like site) ── */
.steps-card{background:var(--card);border-radius:14px;padding:16px;
  margin-bottom:14px;border:1px solid var(--line);
  box-shadow:0 1px 6px rgba(0,0,0,.04);}
.steps-title{font-size:10px;font-weight:700;color:var(--tx3);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;
  display:flex;align-items:center;gap:7px;}
.steps-title::before{content:'';width:3px;height:12px;background:var(--or);border-radius:2px;}
.steps{position:relative;}
.steps::before{
  content:'';position:absolute;right:20px;top:4px;bottom:4px;
  width:1.5px;background:var(--line);
}
html[dir=ltr] .steps::before{right:auto;left:20px;}
.step{display:flex;align-items:flex-start;gap:12px;padding:8px 0;position:relative;}
.si-wrap{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;border:2px solid var(--line);background:#fff;
  position:relative;z-index:1;transition:all .2s;
}
.si-wrap.done{border-color:var(--gn);background:var(--gn-bg);}
.si-wrap.curr{border-color:var(--or);background:rgba(244,121,32,.06);
  box-shadow:0 0 0 4px rgba(244,121,32,.12);}
.si-wrap.up{opacity:.4;}
.sb-info{flex:1;padding-top:9px;}
.sb-name{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:2px;}
.step.up .sb-name{color:var(--tx3);}
.sb-tag{font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:.04em;}
.sb-tag.done{color:var(--gn);}
.sb-tag.curr{color:var(--or);}
.sb-tag.up{color:var(--tx3);}

/* ── NEXT STEP (site uses orange accent left border) ── */
.ns-card{
  background:var(--card);border-radius:12px;
  border-right:4px solid var(--or);
  padding:14px 16px;margin-bottom:14px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line);
  box-shadow:0 1px 6px rgba(0,0,0,.04);
}
html[dir=ltr] .ns-card{border-right:1px solid var(--line);border-left:4px solid var(--or);}
.ns-label{font-size:9.5px;font-weight:700;color:var(--or);
  letter-spacing:.08em;text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;margin-bottom:5px;display:block;}
.ns-text{font-size:13px;color:var(--tx);font-weight:600;line-height:1.55;}

/* ── NOTES ── */
.notes-card{background:var(--line2);border-radius:10px;
  padding:13px 15px;margin-bottom:14px;border:1px solid var(--line);}
.nl{font-size:9.5px;font-weight:700;color:var(--tx3);
  letter-spacing:.08em;text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;margin-bottom:5px;display:block;}
.nb{font-size:12.5px;color:var(--tx2);line-height:1.65;}

/* ── INFO CARD ── */
.info-card{background:var(--card);border-radius:12px;
  border:1px solid var(--line);padding:0 14px;margin-bottom:14px;
  box-shadow:0 1px 6px rgba(0,0,0,.04);}
.ir{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);gap:10px;}
.ir:last-child{border-bottom:none;}
.ik{font-size:11.5px;color:var(--tx3);font-weight:700;}
.iv{font-size:12.5px;color:var(--tx);font-weight:600;text-align:end;}

/* ── NOT FOUND ── */
.nf{text-align:center;padding:32px 0 16px;}
.nf-ico{font-size:42px;margin-bottom:10px;opacity:.3;}
.nf-msg{font-size:13px;color:var(--tx3);}

/* ── CONFETTI ── */
.cf-wrap{position:fixed;inset:0;pointer-events:none;z-index:990;overflow:hidden;}
.cf-p{position:absolute;width:8px;height:8px;border-radius:2px;animation:cf linear forwards;}
@keyframes cf{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ── FOOTER ── */
.footer-block{
  background:var(--navy);padding:20px 18px;margin-top:8px;
}
.fb-brand{font-weight:800;font-size:14px;color:var(--or);margin-bottom:8px;letter-spacing:.02em;}
.fb-row{font-size:11px;color:rgba(255,255,255,.5);margin:3px 0;direction:ltr;}
.fb-row a{color:rgba(255,255,255,.55);text-decoration:none;}
.fb-row a:hover{color:var(--or);}
.footer-txt{text-align:center;padding:10px 16px;font-size:10px;
  color:rgba(255,255,255,.3);background:var(--navy2);}

/* ── WA ── */
.wa-fab{
  position:fixed;bottom:18px;right:18px;width:50px;height:50px;
  border-radius:50%;background:#25d366;
  box-shadow:0 4px 14px rgba(37,211,102,.42);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;z-index:50;transition:transform .2s;
}
.wa-fab:hover{transform:scale(1.08);}
.wa-fab svg{width:25px;height:25px;fill:#fff;}
</style>
</head>

var lang='ar', lastRec=null;
function L(){return I[lang];}

function applyLang(){
  var l=L();
  document.getElementById('R').setAttribute('lang',lang);
  document.getElementById('R').setAttribute('dir',l.dir);
  function s(id,t){var e=document.getElementById(id);if(e)e.textContent=t;}
  s('hEy',l.eyebrow);s('hTi',l.title);s('hSb',l.sub);
  document.getElementById('inp').placeholder=l.ph;
  s('hFo',l.footer);
  document.getElementById('bAR').classList.toggle('on',lang==='ar');
  document.getElementById('bEN').classList.toggle('on',lang==='en');
}
document.getElementById('bAR').onclick=function(){if(lang!=='ar'){lang='ar';applyLang();if(lastRec)render(lastRec);}};
document.getElementById('bEN').onclick=function(){if(lang!=='en'){lang='en';applyLang();if(lastRec)render(lastRec);}};

var _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function tone(f,d,t,v,dl){try{var c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t||'sine';o.frequency.setValueAtTime(f,c.currentTime+(dl||0));g.gain.setValueAtTime(0.001,c.currentTime+(dl||0));g.gain.linearRampToValueAtTime(v,c.currentTime+(dl||0)+0.012);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(dl||0)+d);o.start(c.currentTime+(dl||0));o.stop(c.currentTime+(dl||0)+d+0.06);}catch(e){}}
var sfx={
  ok:function(){tone(440,.15,'sine',.06,0);tone(550,.15,'sine',.07,.1);tone(660,.25,'sine',.08,.2);},
  bad:function(){tone(300,.2,'triangle',.06,0);tone(220,.28,'triangle',.05,.18);},
  done:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.2+i*.05,'sine',.07+i*.01,i*.14);});}
};
function confetti(){
  var cols=['#F47920','#C8972B','#00875A','#0d1b2a','#fff','#ff8c38'];
  var w=document.createElement('div');w.className='cf-wrap';document.body.appendChild(w);
  for(var i=0;i<100;i++){(function(i){setTimeout(function(){
    var p=document.createElement('div');p.className='cf-p';
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.width=(5+Math.random()*8)+'px';p.style.height=(5+Math.random()*8)+'px';
    p.style.animationDuration=(1.3+Math.random()*2)+'s';
    w.appendChild(p);
  },i*22);})(i);}
  setTimeout(function(){if(w.parentNode)w.parentNode.removeChild(w);},6000);
}

function parseCsv(txt){
  var rows=[],row=[],cur='',inq=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charCodeAt(i);
    if(inq){if(ch===34&&txt.charCodeAt(i+1)===34){cur+='"';i++;}else if(ch===34){inq=false;}else{cur+=txt[i];}}
    else{if(ch===34){inq=true;}else if(ch===44){row.push(cur);cur='';}
    else if(ch===10||ch===13){if(ch===13&&txt.charCodeAt(i+1)===10)i++;row.push(cur);rows.push(row);row=[];cur='';}
    else{cur+=txt[i];}}
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(v){return v.trim()!=='';});});
}
async function loadData(){
  try{var lc=localStorage.getItem('ig_verify_data');if(lc){var p=JSON.parse(lc);if(Array.isArray(p)&&p.length)return p;}}catch(e){}
  var r=await fetch(CSV+'&t='+Date.now());
  if(!r.ok)throw new Error('net');
  var txt=await r.text();
  var rows=parseCsv(txt);
  var hdr=rows[0].map(function(h){return h.trim().toLowerCase();});
  return rows.slice(1).map(function(r){var o={};hdr.forEach(function(h,i){o[h]=(r[i]||'').trim();});return o;});
}
function findRec(rows,id){
  var n=id.trim().toLowerCase();
  return rows.find(function(r){return (r['contractid']||'').trim().toLowerCase()===n;});
}
function esc(s){return (s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function getTrack(rec){
  var hf=(rec['hasforeign']||'').toLowerCase();
  return (hf==='yes'||hf==='نعم')?TF:TN;
}
function getPct(rec){
  var p=parseInt(rec['progress']||'0');
  return(!isNaN(p)&&p>=0&&p<=100)?p:0;
}
function getStageName(rec,track,pct){
  var l=(rec['steplabel']||rec['currentstage']||'').trim();
  if(l)return l;
  var best=0;
  for(var i=0;i<track.length;i++){if(track[i][3]<=pct)best=i;}
  return lang==='ar'?track[best][1]:track[best][2];
}
function getCurIdx(track,pct){
  var best=0;
  for(var i=0;i<track.length;i++){if(track[i][3]<=pct)best=i;}
  return best;
}

function render(rec){
  var l=L(),out=document.getElementById('out');
  lastRec=rec;
  var raw=(rec['status']||'').trim();
  var isCancelled=['cancel','ملغى','ملغي','void'].some(function(w){return raw.toLowerCase().includes(w);});
  var isWaiting=['wait','waiting','انتظار'].some(function(w){return raw.toLowerCase().includes(w);});
  var track=getTrack(rec);
  var pct=getPct(rec);
  var isDone=pct>=100;
  var curIdx=getCurIdx(track,pct);
  var stageName=getStageName(rec,track,pct);
  var cid=(rec['contractid']||'').trim();
  var cname=(rec['clientname']||'').trim();
  var resp=(rec['responsiblename']||'').trim();
  var notes=(rec['notes']||'').trim();
  var ns=(rec['nextstep']||'').trim();
  var iDate=(rec['issuedate']||'').trim();
  var pctCls=isDone?'hi':pct>=50?'hi':'';
  var chipCls=isDone?'chip-gn':isCancelled?'chip-rd':isWaiting?'chip-gy':'chip-or';
  var chipTxt=isDone?l.finish:isCancelled?l.cancel:isWaiting?l.wait:l.active;

  var html='';

  /* welcome or complete */
  if(isDone&&cname){
    html+='<div class="cc">'+
      '<span class="cc-ico">🏆</span>'+
      '<div class="cc-ttl">'+l.cbTitle+'</div>'+
      '<div class="cc-nm">'+esc(l.cbName(cname))+'</div>'+
      '<div class="cc-msg">'+esc(l.cbMsg)+'</div>'+
      '<div class="cc-stars">⭐⭐⭐⭐⭐</div>'+
    '</div>';
  }else if(cname){
    html+='<div class="wc">'+
      '<div class="wc-eyebrow">'+esc(l.wEy(cid))+'</div>'+
      '<div class="wc-name">'+esc(l.wName(cname))+'</div>'+
      '<div class="wc-msg">'+esc(l.wMsg)+'</div>'+
      '<div class="wc-badge">'+esc(l.wBadge)+'</div>'+
    '</div>';
  }

  /* status row */
  html+='<div class="status-row">'+
    '<div class="stat-chip '+chipCls+'"><span class="cdot"></span>'+chipTxt+'</div>'+
    '<div class="stat-id">'+esc(cid)+'</div>'+
  '</div>';

  /* progress */
  if(!isDone){
    html+='<div class="prog-card">'+
      '<div class="pc-top">'+
        '<div><div class="pc-label">'+l.prog+'</div><div class="pc-stage">'+esc(stageName)+'</div></div>'+
        '<div class="pc-pct '+pctCls+'" id="pPct">0%</div>'+
      '</div>'+
      '<div class="bar-bg"><div class="bar-fill '+pctCls+'" id="pFill"></div></div>'+
      '<div class="bar-lbr"><span>'+l.jS+'</span><span>'+l.jE+'</span></div>'+
    '</div>';
  }

  /* steps */
  var maxShow=isDone?track.length:Math.min(curIdx+4,track.length);
  var stepsHtml='';
  for(var i=0;i<maxShow;i++){
    var s=track[i];
    var isD=s[3]<pct||(isDone);
    var isC=!isDone&&i===curIdx;
    var isU=!isD&&!isC;
    var ic=isD?'done':isC?'curr':'up';
    var tc=isD?'done':isC?'curr':'up';
    var tt=isD?l.done:isC?l.curr:l.up;
    var nm=lang==='ar'?s[1]:s[2];
    stepsHtml+='<div class="step">'+
      '<div class="si-wrap '+ic+'">'+s[0]+'</div>'+
      '<div class="sb-info">'+
        '<div class="sb-name">'+esc(nm)+'</div>'+
        '<div class="sb-tag '+tc+'">'+tt+'</div>'+
      '</div>'+
    '</div>';
  }
  if(maxShow<track.length){
    var rem=track.length-maxShow;
    stepsHtml+='<div style="text-align:center;padding:6px 0;font-size:11px;color:var(--tx3)">'+rem+' '+(lang==='ar'?'مراحل أخرى':'more stages')+'</div>';
  }
  html+='<div class="steps-card">'+
    '<div class="steps-title">'+l.tlTitle+'</div>'+
    '<div class="steps">'+stepsHtml+'</div>'+
  '</div>';

  /* next step */
  if(ns) html+='<div class="ns-card"><span class="ns-label">'+l.ns+'</span><div class="ns-text">'+esc(ns)+'</div></div>';

  /* notes */
  if(notes) html+='<div class="notes-card"><span class="nl">'+l.notes+'</span><div class="nb">'+esc(notes)+'</div></div>';

  /* info */
  var iRows='<div class="ir"><span class="ik">'+l.cNo+'</span><span class="iv">'+esc(cid)+'</span></div>';
  if(iDate) iRows+='<div class="ir"><span class="ik">'+l.iDate+'</span><span class="iv">'+esc(iDate)+'</span></div>';
  iRows+='<div class="ir"><span class="ik">'+l.status+'</span><span class="iv">'+esc(raw)+'</span></div>';
  if(resp) iRows+='<div class="ir"><span class="ik">'+l.resp+'</span><span class="iv">'+esc(resp)+'</span></div>';
  html+='<div class="info-card">'+iRows+'</div>';

  out.innerHTML=html;

  setTimeout(function(){
    var pf=document.getElementById('pFill'),pe=document.getElementById('pPct');
    if(pf)pf.style.width=pct+'%';
    if(pe){var c=0;var iv=setInterval(function(){c=Math.min(c+Math.ceil(pct/36),pct);pe.textContent=c+'%';if(c>=pct)clearInterval(iv);},22);}
  },380);

  if(isDone){setTimeout(function(){sfx.done();confetti();},300);}
  else if(!isCancelled){setTimeout(function(){sfx.ok();},300);}
  else{setTimeout(function(){sfx.bad();},300);}
}

async function go(){
  var l=L(),out=document.getElementById('out');
  var id=inp.value.trim();
  if(!id){out.innerHTML='<div class="nf"><div class="nf-ico">📋</div><p class="nf-msg">'+l.noId+'</p></div>';return;}
  out.innerHTML='<div class="loading"><div class="dots"><span></span><span></span><span></span></div><p class="ltxt">'+l.chk+'</p></div>';
  document.getElementById('btnGo').disabled=true;
  try{
    var rows=await loadData();
    var rec=findRec(rows,id);
    if(!rec){sfx.bad();out.innerHTML='<div class="nf"><div class="nf-ico">🔍</div><p class="nf-msg">'+esc(l.noMatch(id))+'</p></div>';}
    else{render(rec);}
  }catch(e){out.innerHTML='<div class="nf"><div class="nf-ico">⚠️</div><p class="nf-msg">'+l.err+'</p></div>';}
  finally{document.getElementById('btnGo').disabled=false;}
}

(function(){
  applyLang();
  var id=new URLSearchParams(location.search).get('id');
  if(id){inp.value=id;clr.classList.add('v');go();}
